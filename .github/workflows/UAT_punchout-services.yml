# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions
#
# Deploys the UAT branch -> the 'uat' deployment slot of the same
# punchout-services App Service that master deploys to (see
# master_punchout-services.yml for the Production counterpart).
#
# Requires a GitHub secret AZUREAPPSERVICE_PUBLISHPROFILE_UAT: in the
# Azure portal, open the punchout-services App Service -> Deployment
# slots -> uat -> "Get publish profile" (this must be the slot's own
# profile, not the Production slot's), then paste its contents into
# that repo secret.
#
# One-time manual portal step this workflow cannot do for you: set the
# uat slot's own Startup Command (Configuration -> General settings,
# with the slot selected) to `startup.sh`.

name: Build and deploy PHP app to Azure Web App - punchout-services (UAT)

on:
  push:
    branches:
      - UAT
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Composer install (production dependencies only)
        run: composer install --prefer-dist --no-progress --no-dev --optimize-autoloader --no-interaction

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install npm dependencies and build frontend assets
        run: |
          npm ci
          npm run build

      - name: Remove files not needed at runtime
        run: rm -rf node_modules tests .github .git composer.phar

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: php-app
          path: .

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: UAT
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: php-app

      - name: 'Deploy to Azure Web App Slot (uat)'
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'punchout-services'
          slot-name: 'uat'
          package: .
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_UAT }}
