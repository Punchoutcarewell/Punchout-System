# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions
#
# Deploys master -> the Production slot of the punchout-services App Service.
# See UAT_punchout-services.yml for the UAT branch/slot counterpart.
#
# One-time manual portal step this workflow cannot do for you: set the
# Production slot's Startup Command (Configuration -> General settings)
# to `startup.sh`. Without that, nginx keeps its default document root
# and the app 404s/serves a placeholder page no matter how many times
# this workflow deploys.

name: Build and deploy PHP app to Azure Web App - punchout-services

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Composer install (production dependencies only)
        run: composer install --prefer-dist --no-progress --no-dev --optimize-autoloader --no-interaction

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install npm dependencies and build frontend assets
        run: |
          npm ci
          npm run build

      - name: Remove files not needed at runtime
        run: rm -rf node_modules tests .github .git composer.phar

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: php-app
          path: .

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: Production
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: php-app

      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'punchout-services'
          slot-name: 'Production'
          package: .
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_D9961B26B24145C3B61B4AE950781106 }}